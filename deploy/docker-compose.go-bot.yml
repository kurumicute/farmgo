# 讓 Go 版接手 Discord Bot（農場面板＋音樂）。與 docker-compose.go-web.yml 一樣是 Python 專案 docker-compose.yml 的覆寫檔，
# 兩個專案放在同一層目錄。可以和 go-web、redis 覆寫檔一起使用，在 Python 專案目錄執行：
#
#   docker compose -f docker-compose.yml -f ../fmgonew/deploy/docker-compose.go-web.yml \
#                  -f ../fmgonew/deploy/docker-compose.go-bot.yml up -d --build bot
#
# 改回 Python 版：不加這個覆寫檔再 up -d --build bot。
#
# 說明：
# - 音樂與 Python 相同：沒有設定 MUSIC_BOT_TOKEN 時在農場 Bot 內執行，連線 LAVALINK_URI（compose 已依 LAVALINK_REMOTE_URI 設定）；
#   各伺服器的音量與前綴沿用 Python 的 data/music_guild_settings.json（基底 compose 已把 farmgm_data 掛在 /app/data，
#   Go 映像同樣以 uid 10001 執行，可以直接讀寫）。只有斜線指令（前綴指令需要 Message Content 特權 Intent）。
# - 指令同步以整批覆寫：/farm、/help 與 16 個音樂指令（與 Python 相同的名稱與參數）。
# - 同一個 Token 只能有一個 Bot 程序：Python 與 Go 版的 bot 不能同時執行。
# - 背景結算仍由 BACKGROUND_TASKS_RUNNER 決定（web／bot／none），整個系統只能有一個程序結算。
# - Go 版新增的果醬：玩家用 Go 版做過新果醬後，就不能再切回 Python 版 Bot（Python 不認得這些代碼）。
services:
  bot:
    build:
      context: ../fmgonew
      dockerfile: Dockerfile
    image: farmgm-go:latest
    command: ["farmgm-bot"]
